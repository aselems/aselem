<!DOCTYPE html>
<html lang="es">

<head>
    <title>Página Responsiva</title>
    <meta charset="utf8">
    <link rel="stylesheet" href="estilos.css" type="text/css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
</head>

<header class="bg-primary text-white text-center py-4">
    <h1>Mi página de presentación</h1>
</header>

<body>
    <div class="container mt-4 mb-4">
        <div class="row">
            <!--Columna principal-->
            <div id="carouselExampleControls" class="col-md-8 border carousel slide" data-bs-ride="carousel" ">
              <div class="carousel-inner">
                <div class="carousel-item active">
                  <img src="TI_1.jpg" class="d-block w-100" alt="...">
                </div>
                <div class="carousel-item">
                  <img src="TI_2.jpg" class="d-block w-100" alt="...">
                </div>
              </div>
              <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Anterior</span>
              </button>
              <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Siguiente</span>
              </button>
            </div>      
            <!--Barra lateral-->
            <div class="col-md-4 d-none d-sm-block">
              <div class="card" style="width: 18rem;">
                <img class="card-img-top" src="persona.jpg" alt="Card image cap">
                <div class="card-body">
                  <h5 class="card-title">Abraham Elias Selem Salinas</h5>
                  <p class="card-text" style="text-align: justify;">Abraham Selem Es empleado en la Comisión de Agua Potable y Alcantarillado desde hace 18 años. Se ha desempeñado en el área de informática y en el área de Recursos Humanos.</p>
                </div>
              </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body> 
<footer class="bg-dark text-white text-center py-3 mt-4">
    <p>&copy; 2024 Mi página responsiva Todos los derechos reservados.</p>
</footer>
</html>
